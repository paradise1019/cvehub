services:
  cvehub:
    build:
      context: .
      # 建置設定都寫在 .env 的「0. 建置」（docker compose 會自動讀同目錄的 .env）
      args:
        BASE_IMAGE: ${BASE_IMAGE:-python:3.12-slim}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
        PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-}
        HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
        HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
        NO_PROXY: ${BUILD_NO_PROXY:-}
        CODE_FP: ${CODE_FP:-}              # 由 scripts/upgrade.sh 帶入，不要寫在 .env
    image: ${CVEHUB_IMAGE:-cvehub}:0.9.12    # 名稱在 .env 的 CVEHUB_IMAGE（同一台的每一套各用各的）；版本號不要改
    env_file: .env
    ports:
      - "${WEB_HOST_PORT:-8080}:8080"      # 主機的 port 在 .env 的 WEB_HOST_PORT 設定；右邊是容器內部，不要改
    volumes:
      - ./data:/data
      - ./config:/config:ro            # 放 landscape_server_ca.crt 等
    restart: unless-stopped
