services:
  cvehub:
    build:
      context: .
      args:
        # 內網改成 Nexus，例如 https://nexus.example.com/repository/pypi-proxy/simple
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    image: cvehub:0.5.1
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ./config:/config:ro            # 放 landscape_server_ca.crt 等
    restart: unless-stopped
