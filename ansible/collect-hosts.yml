# 收集 cvehub 主機清單（.env 設 HOST_SOURCE=file 時使用）
# 每台主機產生：Ubuntu 版本、Pro 狀態、執行中 kernel、所有已安裝套件 → 合併成一個 CSV
# 只讀取（dpkg-query、uname、pro status），不需要 sudo、不改任何東西
#
# 用法：
#   ansible-playbook -i <inventory> collect-hosts.yml
#   ansible-playbook -i <inventory> collect-hosts.yml -e cvehub_hosts=ubuntu_servers -e cvehub_out=/tmp/hosts.csv
#   （--limit 也可以用）
# 產生的檔案從 cvehub 網頁「資料匯入」上傳，或放到 cvehub 的 data/hosts-inbox/
#
# 變數：
#   cvehub_hosts     要收集的主機（inventory 群組或樣式），預設 all
#   cvehub_out       輸出檔，預設執行者家目錄下 cvehub-hosts-<日期時間>.csv
#   cvehub_hostname  CSV 裡的主機名稱，預設 inventory 名稱
#   cvehub_ip        CSV 裡的 IP（只用來顯示）。沒指定時：SSH 連線用實際連進這台主機的位址（SSH_CONNECTION 的主機端，
#                    ssh_config 別名、跳板機都正確）；本機或其他連線方式、或得到 loopback 時，用 hostname -I 的第一個。
#                    多張網卡（docker、VPN…）或用 -e ansible_become=true 執行時可能不準，請直接設 cvehub_ip

- name: 收集主機清單給 cvehub
  hosts: "{{ cvehub_hosts | default('all') }}"
  gather_facts: false
  become: false
  strategy: linear          # 合併前要等所有主機做完（ansible.cfg 設 free 時也一樣）
  tasks:
    - name: 在控制端建立暫存目錄（每次新的，沒連上的主機不會沿用舊檔）
      ansible.builtin.tempfile:
        state: directory
        prefix: cvehub-parts.
      register: cvehub_tmp
      run_once: true
      delegate_to: localhost

    - name: 產生這台主機的 CSV（連不上或失敗的主機會略過，最後列出）
      ansible.builtin.shell: |
        set -euo pipefail                                         # pipefail：dpkg-query 中途失敗時不能把不完整的套件清單當成成功
        export LC_ALL=C
        . /etc/os-release
        release="${VERSION_ID:-}"
        pro=""
        if command -v pro >/dev/null 2>&1; then
          pro=$(pro status --format json 2>/dev/null | python3 -c 'import json,sys; print("yes" if json.load(sys.stdin).get("attached") else "no")' 2>/dev/null || true)
        fi
        addr=""
        if [ -n "${CVEHUB_SSH:-}" ]; then                          # SSH 連線：實際連進來的位址（本機連線時這是操作者自己的連線，不能用）
          addr=$(echo "${SSH_CONNECTION:-}" | awk '{print $3}')
          [ -n "$addr" ] || echo "沒有 SSH_CONNECTION（可能被 sudo 清掉），IP 改用 hostname -I" >&2
        fi
        case "$addr" in ::ffff:*.*) addr="${addr#::ffff:}" ;; esac   # dual-stack 的 sshd 收 IPv4 連線：::ffff:10.0.0.5 → 10.0.0.5
        case "$addr" in 127.*|::1) addr="" ;; esac
        [ -n "$addr" ] || addr=$(hostname -I 2>/dev/null | tr ' ' '\n' | grep -v -e '^127\.' -e '^::1$' -e '^$' | head -n 1 || true)
        [ -z "${CVEHUB_IP:-}" ] || addr="$CVEHUB_IP"                # 手動指定的優先
        # 會弄亂 CSV 的字元（逗號、引號、空白…）：輸出「格式不對」，cvehub 匯入時保留原本的 IP 並註明（輸出空白會清掉 IP）
        case "$addr" in *[!0-9A-Za-z.:%_-]*) echo "cvehub_ip／IP 含不合法的字元：$addr" >&2; addr="invalid-ip" ;; esac
        krel=$(uname -r)
        kver=$(awk '{print $2}' /proc/version_signature 2>/dev/null || true)
        now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
        echo "hostname,ip,release,pro,kernel_release,kernel_version,collected_at,package,version"
        # 狀態第二個字元是 i＝已安裝（含 hold 的套件）；rc（只剩設定檔）不列
        dpkg-query -W -f='${db:Status-Abbrev}\t${binary:Package}\t${Version}\n' \
          | awk -F'\t' -v p="$HOST,$addr,$release,$pro,$krel,$kver,$now" 'substr($1,2,1)=="i" {print p "," $2 "," $3}'
      args:
        executable: /bin/bash
      environment:
        HOST: "{{ cvehub_hostname | default(inventory_hostname) }}"
        CVEHUB_IP: "{{ cvehub_ip | default('') }}"
        CVEHUB_SSH: "{{ '1' if (ansible_connection | default('ssh') | regex_replace('^ansible\\.(builtin|legacy)\\.', '')) in ['ssh', 'smart', 'paramiko', 'paramiko_ssh'] else '' }}"
      vars:
        ansible_become: false     # 優先於 inventory／group_vars 的 ansible_become：sudo 會清掉 SSH_CONNECTION
      register: cvehub_csv
      changed_when: false
      check_mode: false
      ignore_errors: true
      ignore_unreachable: true

    - name: 存到控制端
      ansible.builtin.copy:
        content: "{{ cvehub_csv.stdout }}\n"
        dest: "{{ cvehub_tmp.path }}/{{ inventory_hostname }}.csv"
        mode: "0600"
      delegate_to: localhost
      when: (cvehub_csv.rc | default(1)) == 0
      ignore_errors: true     # 寫不進控制端也不中斷，最後一定會合併、列出結果、刪除暫存

    - name: 合併成一個 CSV、列出結果、刪除暫存
      run_once: true
      delegate_to: localhost
      block:
        - name: 決定輸出檔名
          ansible.builtin.set_fact:
            cvehub_outfile: "{{ cvehub_out | default(lookup('env', 'HOME') ~ '/cvehub-hosts-' ~ lookup('pipe', 'date +%Y%m%d-%H%M%S') ~ '.csv') }}"

        - name: 合併（每台主機的標題列會留著，cvehub 匯入時會把檔案中間的標題列當成新的欄位對應）
          ansible.builtin.assemble:
            src: "{{ cvehub_tmp.path }}"
            dest: "{{ cvehub_outfile }}"
            mode: "0600"

        - name: 列出收到的主機
          ansible.builtin.find:
            paths: "{{ cvehub_tmp.path }}"
            patterns: "*.csv"
          register: cvehub_parts

        - name: 結果
          vars:
            got: "{{ cvehub_parts.files | map(attribute='path') | map('basename') | map('regex_replace', '\\.csv$', '') | list }}"
          ansible.builtin.debug:
            msg:
              - "輸出：{{ cvehub_outfile }}（主機 {{ got | length }}／{{ ansible_play_hosts_all | length }}）"
              - "沒收到（連不上或失敗）：{{ ansible_play_hosts_all | difference(got) | join(', ') or '無' }}"
      always:
        - name: 刪除暫存目錄
          ansible.builtin.file:
            path: "{{ cvehub_tmp.path }}"
            state: absent
